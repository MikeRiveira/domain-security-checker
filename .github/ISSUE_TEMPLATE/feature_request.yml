name: Check or feature idea
description: Suggest a new check, output format or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should the tool do?
      description: For a new check, say what should count as pass, warning and fail.
