[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domaincheck"
version = "1.0.0"
description = "Check MX, SPF, DKIM, DMARC, SSL and domain expiry across every domain you own."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michael Riveira" }]
requires-python = ">=3.11"
dependencies = ["dnspython>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
domaincheck = "domaincheck.cli:main"

[tool.setuptools]
packages = ["domaincheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
